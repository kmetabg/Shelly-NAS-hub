<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/lib/auth-guard.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cameras · HomeHub</title>
  <style>
    :root {
      --bg:      #07111e;
      --surface: #0d1f35;
      --card:    #112240;
      --border:  #1e3a5f;
      --text:    #e2eaf4;
      --muted:   #6b8cae;
      --accent:  #38bdf8;
      --ok:      #34d399;
      --warn:    #fbbf24;
      --err:     #f87171;
      --r:       12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      background: #000; color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body { display: flex; flex-direction: column; }

    /* ── floating top bar (hover-reveal) ────────────────── */
    /* The top 60px of the viewport activate the header */
    .hdr-trigger {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      z-index: 49;
      pointer-events: auto;
    }
    header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 50;
      padding: .35rem .8rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      background: linear-gradient(180deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 100%);
      opacity: 0;
      transform: translateY(-100%);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .hdr-trigger:hover ~ header,
    header:hover {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .hdr-left { display: flex; align-items: center; gap: .6rem; min-width: 0; }
    .hdr-left h1 { font-size: .85rem; font-weight: 700; color:#fff; }
    .hdr-left .sub { font-size: .68rem; color:#9bb; }
    .hdr-right { display: flex; align-items: center; gap: .4rem; flex-shrink: 0; }
    .back-btn {
      font-size: .72rem; color:#cde; text-decoration: none;
      padding: .2rem .55rem; border: 1px solid rgba(255,255,255,.18);
      border-radius: 5px; background: rgba(0,0,0,.4); backdrop-filter: blur(6px);
      transition: background .15s, border-color .15s;
    }
    .back-btn:hover { background: rgba(56,189,248,.25); border-color: var(--accent); }

    main {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }

    /* ── grid ─────────────────────────────────────────── */
    .cam-grid {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 1fr;
      gap: 2px;                  /* hairline dividers */
      background: #000;
    }
    @media (max-width: 900px) {
      .cam-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .cam-grid { grid-template-columns: 1fr; }
    }

    .cam-card {
      position: relative;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    /* ── full-size image (cover not contain) ────── */
    .cam-view {
      position: absolute; inset: 0;
      background: #000;
      overflow: hidden;
    }
    .cam-view img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;     /* fills the entire cell */
    }

    /* ── overlay top: name + controls (auto-fade) ────────── */
    .cam-overlay-top {
      position: absolute; left: 0; right: 0; top: 0;
      padding: .4rem .55rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: .4rem;
      background: linear-gradient(180deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,0) 100%);
      opacity: 0;
      transition: opacity .2s;
      z-index: 3;
    }
    .cam-card:hover .cam-overlay-top,
    .cam-card:focus-within .cam-overlay-top { opacity: 1; }

    .cam-name-pill {
      font-size: .72rem; font-weight: 600; color:#fff;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      padding: .15rem .5rem; border-radius: 4px;
      max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cam-controls { display: flex; gap: .25rem; flex-shrink: 0; }
    .ctrl-btn {
      font-size: .65rem; font-weight: 600; color:#cde;
      padding: .15rem .45rem; border-radius: 4px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .ctrl-btn:hover { background: rgba(56,189,248,.25); }
    .ctrl-btn.active {
      background: rgba(56,189,248,.4); border-color: var(--accent); color:#fff;
    }

    /* ── overlay bottom: timestamp (thin strip) ─────────── */
    .cam-overlay-bottom {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: .25rem .55rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: .4rem;
      font-size: .62rem; color:#cde;
      background: linear-gradient(0deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 100%);
      opacity: 0;
      transition: opacity .2s;
      z-index: 3;
      font-variant-numeric: tabular-nums;
    }
    .cam-card:hover .cam-overlay-bottom,
    .cam-card:focus-within .cam-overlay-bottom { opacity: 1; }

    /* ── live dot (always visible) ───────────────────────── */
    .cam-live-dot {
      position: absolute; top: .4rem; right: .4rem;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--err);
      box-shadow: 0 0 0 2px rgba(0,0,0,.55);
      z-index: 2;
      opacity: 0;
      transition: opacity .2s;
    }
    .cam-card.is-live .cam-live-dot { opacity: 1; animation: pulse 1.5s infinite; }

    /* ── loading overlay ────────────────────────────────── */
    .cam-view .cam-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000a; pointer-events: none; z-index: 4;
    }
    .cam-view .cam-loading.hidden { display: none; }

    /* ── fullscreen modal ─────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: #000e; z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      position: relative;
      width: 98vw; height: 94vh;
      background: #000; border-radius: var(--r);
      overflow: hidden; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-content img {
      display: block; max-width: 100%; max-height: 100%;
      object-fit: contain; width: 100%; height: 100%;
    }
    .modal-describe {
      position: absolute; top: .6rem; right: 5.5rem;
      background: #1a3a5c; border: 1px solid var(--accent);
      color: var(--accent); padding: .35rem .8rem;
      border-radius: 6px; cursor: pointer; font-size: .8rem;
      transition: background .15s;
    }
    .modal-describe:hover { background: #1e4a7a; }
    .modal-describe:disabled { opacity: .5; cursor: default; }
    .modal-desc {
      position: absolute; bottom: 2.8rem; left: 50%; transform: translateX(-50%);
      background: rgba(7,17,30,.92); border: 1px solid var(--accent);
      border-radius: 8px; padding: .6rem 1rem; font-size: .85rem;
      max-width: 90vw; text-align: center; color: var(--text);
      backdrop-filter: blur(4px);
    }
    .modal-close {
      position: absolute; top: .5rem; right: .5rem;
      background: #000c; border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: .4rem .8rem; cursor: pointer; font-size: .9rem;
      z-index: 10;
    }
    .modal-close:hover { background: #000; border-color: var(--accent); }
    .modal-label {
      position: absolute; bottom: .5rem; left: .75rem;
      font-size: .82rem; color: var(--text); background: #000c;
      padding: .25rem .6rem; border-radius: 4px; z-index: 10;
    }
    .modal-ts {
      position: absolute; bottom: .5rem; right: .75rem;
      font-size: .78rem; color: var(--muted); background: #000c;
      padding: .25rem .6rem; border-radius: 4px; z-index: 10;
      font-variant-numeric: tabular-nums;
    }
    .modal-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .modal-loading.hidden { display: none; }
    .modal-loading .spinner { width: 36px; height: 36px; border-width: 3px; }

    /* ── settings modal ─────────────────────────────── */
    .settings-overlay {
      display: none; position: fixed; inset: 0;
      background: #000c; z-index: 1100;
      align-items: center; justify-content: center;
    }
    .settings-overlay.open { display: flex; }
    .settings-card {
      background: var(--surface); color: var(--text);
      width: min(420px, 92vw);
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 1.2rem 1.4rem;
      display: flex; flex-direction: column; gap: 1rem;
      font-family: inherit;
    }
    .settings-card h2 {
      font-size: 1rem; font-weight: 600;
      display: flex; align-items: center; gap: .5rem;
    }
    .settings-row { display: flex; flex-direction: column; gap: .35rem; }
    .settings-row label { font-size: .8rem; color: var(--muted); }
    .settings-row .value-row {
      display: flex; align-items: center; gap: .6rem;
    }
    .settings-row input[type=range] {
      flex: 1; accent-color: var(--accent);
    }
    .settings-row input[type=number] {
      width: 70px; padding: .3rem .5rem;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: .9rem;
      font-variant-numeric: tabular-nums;
    }
    .settings-row .hint { font-size: .7rem; color: var(--muted); }
    .settings-actions {
      display: flex; justify-content: flex-end; gap: .5rem;
    }
    .settings-btn {
      padding: .4rem .9rem; border-radius: 6px; cursor: pointer;
      font-size: .82rem; font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card); color: var(--text);
      transition: background .15s, border-color .15s;
    }
    .settings-btn:hover { background: rgba(56,189,248,.15); border-color: var(--accent); }
    .settings-btn.primary {
      background: rgba(56,189,248,.25); border-color: var(--accent); color: #fff;
    }
    .settings-btn.primary:hover { background: rgba(56,189,248,.4); }

    /* ── badge ────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .2rem .6rem; border-radius: 20px; font-size: .7rem; font-weight: 600;
      border: 1px solid transparent;
    }
    .badge.online  { background:#052e16; border-color:#166534; color:#34d399; }
    .badge.offline { background:#1c1917; border-color:#44403c; color:#6b8cae; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
    .dot.pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── spinner ──────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
  </style>
</head>
<body>

<div class="hdr-trigger"></div>
<header>
  <div class="hdr-left">
    <h1>📷 Cameras</h1>
    <span class="sub" id="hdr-sub">Loading…</span>
  </div>
  <div class="hdr-right">
    <button class="back-btn" id="btn-all-live"  onclick="setAllLive()"  title="Start live stream from all cameras">▶ All live</button>
    <button class="back-btn" id="btn-all-snap"  onclick="setAllSnap()"  title="Stop streams, return to snapshots">📷 All snap</button>
    <button class="back-btn" id="btn-settings"  onclick="openSettings()" title="Settings">⚙️</button>
    <a href="/cameras-config.html" class="back-btn" title="Add / edit / delete cameras">🛠 Manage</a>
    <a href="/" class="back-btn">← Home</a>
    <a href="/recordings.html" class="back-btn">📼 Recordings</a>
    <a href="/events.html" class="back-btn">🎯 Events</a>
    <a href="/faces.html"  class="back-btn">👤 Faces</a>
  </div>
</header>

<!-- Settings modal -->
<div class="settings-overlay" id="settings" onclick="closeSettings(event)">
  <div class="settings-card" onclick="event.stopPropagation()">
    <h2>⚙️ Settings</h2>
    <div class="settings-row">
      <label for="set-interval">Refresh interval (snapshot mode)</label>
      <div class="value-row">
        <input type="range"  id="set-interval-range" min="2" max="60" step="1" />
        <input type="number" id="set-interval"       min="2" max="60" step="1" />
        <span>sec</span>
      </div>
      <span class="hint">2–60 seconds. Affects all cameras in snapshot mode.</span>
    </div>
    <div class="settings-actions">
      <button class="settings-btn"         onclick="closeSettings()">Cancel</button>
      <button class="settings-btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<main>
  <div class="cam-grid" id="cam-grid"></div>
</main>

<!-- Fullscreen modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-content">
    <img    id="modal-img" src="" alt="" />
    <video  id="modal-video" autoplay muted playsinline
            style="display:none; max-width:100%; max-height:90vh; background:#000;"></video>
    <div class="modal-loading hidden" id="modal-loading"><div class="spinner"></div></div>
    <button class="modal-close" onclick="closeModal()">✕ Close</button>
    <button class="modal-describe" id="btn-describe" onclick="describeCamera()">🔍 Describe</button>
    <div class="modal-label" id="modal-label"></div>
    <div class="modal-ts"    id="modal-ts"></div>
    <div class="modal-desc"  id="modal-desc" style="display:none"></div>
  </div>
</div>

<script src="/lib/hls.min.js"></script>

<script>
  // ── configuration ───────────────────────────────────────
  const SETTINGS_KEY      = "homehub_cam_settings";
  const DEFAULT_SNAP_SEC  = 10;
  let   SNAP_INTERVAL     = loadSettings().snapSec * 1000;  // auto-refresh snapshot (ms)
  const CHANNELS = [];          // populated from /api/camera/list

  // ── settings persistence ──────────────────────────────
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
      const sec = Math.min(60, Math.max(2, parseInt(s.snapSec) || DEFAULT_SNAP_SEC));
      return { snapSec: sec };
    } catch {
      return { snapSec: DEFAULT_SNAP_SEC };
    }
  }
  function persistSettings(s) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {}
  }

  // ── state ──────────────────────────────────────────────
  const camState     = {};    // ch → { mode: "snap"|"live", timer: id, lastTs: Date, hls?: Hls }
  const recArmedCache = {};   // ch → bool (recording armed → we can use HLS instead of a new RTSP)
  let   _modalHls    = null;  // active HLS player in the modal

  /* ── recording status cache ──────────────────────────── */
  async function refreshRecArmed() {
    try {
      const r = await fetch("/api/recordings/cameras");
      if (!r.ok) return;
      const data = await r.json();
      const list = data.cameras || (Array.isArray(data) ? data : []);
      list.forEach(c => recArmedCache[c.channel] = !!c.armed && !!c.active);
    } catch {}
  }
  function shouldUseHls(ch) {
    // Recording armed → we can use HLS instead of a new stream
    // (valid for both NVR and Shelly after Phase 4 — MJPEG → H.264 transcoding)
    return !!recArmedCache[ch];
  }
  function hlsUrl(ch) { return `/api/recordings/${ch}/live.m3u8`; }

  function startHls(videoEl, ch) {
    const url = hlsUrl(ch);
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({
        lowLatencyMode:        true,
        liveSyncDurationCount: 2,
        maxBufferLength:       10,
        backBufferLength:      0,
      });
      hls.loadSource(url);
      hls.attachMedia(videoEl);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) console.warn("HLS fatal", data); 
      });
      return hls;
    }
    if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
      videoEl.src = url;  // Safari native
    }
    return null;
  }
  function stopHls(hls, videoEl) {
    try { hls && hls.destroy(); } catch {}
    if (videoEl) { try { videoEl.pause(); videoEl.removeAttribute("src"); videoEl.load(); } catch {} }
  }

  // ── localStorage cache ────────────────────────────────────
  function saveSnap(ch, imgEl) {
    try {
      const MAX_W = 800;
      const scale = Math.min(1, MAX_W / (imgEl.naturalWidth || MAX_W));
      const w = Math.round((imgEl.naturalWidth || MAX_W) * scale);
      const h = Math.round((imgEl.naturalHeight || 600) * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(imgEl, 0, 0, w, h);
      localStorage.setItem(`cam_snap_${ch}`, c.toDataURL("image/jpeg", 0.75));
      localStorage.setItem(`cam_snap_ts_${ch}`, new Date().toLocaleTimeString("en-US", { timeStyle: "medium" }));
    } catch {}
  }
  function loadSnap(ch) { return localStorage.getItem(`cam_snap_${ch}`); }
  function loadSnapTs(ch) { return localStorage.getItem(`cam_snap_ts_${ch}`) || ""; }

  // ── helpers ────────────────────────────────────────────
  function nowStr() {
    return new Date().toLocaleTimeString("en-US", { timeStyle: "medium" });
  }

  // ── build card (full-bleed + overlay UI) ──────
  function buildCard(ch, name) {
    const cached     = loadSnap(ch);
    const cachedTs   = loadSnapTs(ch);
    const initialSrc = cached || chSnapUrl(ch);
    const showLoading = !cached;
    return `
      <div class="cam-card" id="card-${ch}" tabindex="0">
        <div class="cam-view" id="view-${ch}" onclick="openModal(${ch},'${name}')">
          <img id="img-${ch}" src="${initialSrc}"
               alt="${name}" onload="onImgLoad(${ch})" onerror="onImgErr(${ch})" />
          <video id="vid-${ch}" autoplay muted playsinline
                 style="display:none; width:100%; height:100%; object-fit:cover; background:#000;"></video>
          <div class="cam-loading ${showLoading ? "" : "hidden"}" id="loading-${ch}">
            <div class="spinner"></div>
          </div>
        </div>
        <span class="cam-live-dot"></span>
        <div class="cam-overlay-top" onclick="event.stopPropagation()">
          <span class="cam-name-pill" title="${chLabel(ch)}">${name}</span>
          <div class="cam-controls">
            <button class="ctrl-btn active" id="btn-snap-${ch}" onclick="setSnap(${ch})" title="Snapshot">📷</button>
            <button class="ctrl-btn"        id="btn-live-${ch}" onclick="setLive(${ch})" title="Live">▶</button>
          </div>
        </div>
        <div class="cam-overlay-bottom">
          <span id="cam-mode-${ch}">SNAP ${Math.round(SNAP_INTERVAL/1000)}s</span>
          <span id="cam-ts-${ch}">${cachedTs}</span>
        </div>
      </div>`;
  }

  // ── snapshot mode ─────────────────────────────────────
  function setSnap(ch) {
    const st = camState[ch];
    if (st.mode === "snap") return;
    clearInterval(st.timer);
    clearTimeout(st.timer);
    if (st.ws) { st.ws.close(); st.ws = null; }
    if (st.hls) { stopHls(st.hls, document.getElementById(`vid-${ch}`)); st.hls = null; }
    st.mode = "snap";

    const img = document.getElementById(`img-${ch}`);
    const vid = document.getElementById(`vid-${ch}`);
    if (vid) vid.style.display = "none";
    if (img) {
      img.style.display = "";
      img.src = "";
      img.onload  = () => onImgLoad(ch);
      img.onerror = () => onImgErr(ch);
      img.src = chSnapUrl(ch);
    }
    showLoadingEl(ch, true);

    document.getElementById(`btn-snap-${ch}`).classList.add("active");
    document.getElementById(`btn-live-${ch}`).classList.remove("active");
    document.getElementById(`cam-mode-${ch}`).textContent = `SNAP ${Math.round(SNAP_INTERVAL/1000)}s`;
    document.getElementById(`card-${ch}`)?.classList.remove("is-live");

    st.timer = setInterval(() => refreshSnap(ch), SNAP_INTERVAL);
  }

  function refreshSnap(ch) {
    const preload = new Image();
    preload.onload = () => {
      const img = document.getElementById(`img-${ch}`);
      if (img) img.src = preload.src;
      saveSnap(ch, preload);
      showLoadingEl(ch, false);
      const ts = document.getElementById(`cam-ts-${ch}`);
      if (ts) ts.textContent = nowStr();
    };
    preload.onerror = () => showLoadingEl(ch, false);
    preload.src = chSnapUrl(ch);
  }

  // ── live mode — HLS (if armed) or MJPEG fallback ─
  function setLive(ch) {
    const st = camState[ch];
    if (st.mode === "live") return;
    clearInterval(st.timer);
    clearTimeout(st.timer);
    if (st.ws) { st.ws.close(); st.ws = null; }
    if (st.hls) { stopHls(st.hls, document.getElementById(`vid-${ch}`)); st.hls = null; }
    st.mode = "live";

    const useHls = shouldUseHls(ch);
    document.getElementById(`btn-live-${ch}`).classList.add("active");
    document.getElementById(`btn-snap-${ch}`).classList.remove("active");
    document.getElementById(`cam-mode-${ch}`).textContent = useHls ? "LIVE (HLS)" : "LIVE";
    document.getElementById(`card-${ch}`)?.classList.add("is-live");
    showLoadingEl(ch, true);

    const img = document.getElementById(`img-${ch}`);
    const vid = document.getElementById(`vid-${ch}`);

    if (useHls && vid) {
      // Shared stream from the recorder
      if (img) img.style.display = "none";
      vid.style.display = "";
      vid.onloadeddata = () => showLoadingEl(ch, false);
      vid.onerror      = () => showLoadingEl(ch, false);
      st.hls = startHls(vid, ch);
    } else if (img) {
      // Fallback MJPEG (Shelly or recording disabled)
      if (vid) vid.style.display = "none";
      img.style.display = "";
      img.onload  = () => showLoadingEl(ch, false);
      img.onerror = () => showLoadingEl(ch, false);
      img.src = chVideoUrl(ch);
    }
    st.timer = setInterval(() => {
      if (camState[ch].mode !== "live") return;
      const ts = document.getElementById(`cam-ts-${ch}`);
      if (ts) ts.textContent = nowStr();
    }, 1000);
  }

  // ── loading overlay ────────────────────────────────────
  function showLoadingEl(ch, show) {
    const el = document.getElementById(`loading-${ch}`);
    if (el) el.classList.toggle("hidden", !show);
  }
  function onImgLoad(ch) {
    showLoadingEl(ch, false);
    const img = document.getElementById(`img-${ch}`);
    if (img && !img.src.startsWith("data:")) {
      saveSnap(ch, img);
    }
    const ts = document.getElementById(`cam-ts-${ch}`);
    if (ts && !img?.src.startsWith("data:")) ts.textContent = nowStr();
  }
  function onImgErr(ch) {
    showLoadingEl(ch, false);
    const img = document.getElementById(`img-${ch}`);
    if (img && img.src.startsWith("data:")) {
      // Bad cache — clear and fetch a fresh snapshot
      localStorage.removeItem(`cam_snap_${ch}`);
      localStorage.removeItem(`cam_snap_ts_${ch}`);
      refreshSnap(ch);
      return;
    }
    const ts = document.getElementById(`cam-ts-${ch}`);
    if (ts && !ts.textContent) ts.textContent = "Error";
  }

  // ── fullscreen modal ───────────────────────────────────
  let _modalCh    = null;
  let _modalTsTimer = null;

  function openModal(ch, name) {
    _modalCh = ch;
    const modal  = document.getElementById("modal");
    const mImg   = document.getElementById("modal-img");
    const mVid   = document.getElementById("modal-video");
    const mLabel = document.getElementById("modal-label");
    const mTs    = document.getElementById("modal-ts");
    const mLoad  = document.getElementById("modal-loading");

    // Show the cached image immediately, then start HD video
    const cached = document.getElementById(`img-${ch}`)?.src;
    if (cached && !cached.includes("/video")) {
      mImg.src = cached;
      mImg.style.display = "";
      mVid.style.display = "none";
      mLoad.classList.add("hidden");
    } else {
      mImg.src = "";
      mLoad.classList.remove("hidden");
    }

    const useHls = shouldUseHls(ch);
    mLabel.textContent = `${name} · ${chLabel(ch)} · ${useHls ? "▶ HLS (shared)" : "▶ MJPEG"}`;
    mTs.textContent = "";
    const mDescBtn = document.getElementById("btn-describe");
    if (mDescBtn) mDescBtn.style.display = "";
    modal.classList.add("open");

    // Pause the card timer while the modal is open
    const st = camState[ch];
    if (st?.timer) {
      clearInterval(st.timer);
      st._pausedByModal = true;
      st._pausedMode    = st.mode;
    }

    // Load the live video stream in the modal
    stopHls(_modalHls, mVid);
    _modalHls = null;

    if (useHls) {
      // HLS — shared with the recorder, no 2nd RTSP connection
      mImg.style.display = "none";
      mVid.style.display = "";
      mVid.onloadeddata = () => mLoad.classList.add("hidden");
      mVid.onerror      = () => mLoad.classList.add("hidden");
      _modalHls = startHls(mVid, ch);
    } else {
      // Fallback: MJPEG — separate RTSP connection
      mImg.style.display = "";
      mVid.style.display = "none";
      mImg.onload  = () => mLoad.classList.add("hidden");
      mImg.onerror = () => mLoad.classList.add("hidden");
      mImg.src = chVideoUrl(ch);
    }

    clearInterval(_modalTsTimer);
    _modalTsTimer = setInterval(() => {
      if (_modalCh !== ch) return;
      mTs.textContent = nowStr();
    }, 1000);
  }

  async function describeCamera() {
    if (_modalCh === null) return;
    const btn  = document.getElementById("btn-describe");
    const desc = document.getElementById("modal-desc");
    btn.disabled    = true;
    btn.textContent = "⏳ …";
    desc.style.display  = "block";
    desc.textContent    = "Analyzing frame…";
    try {
      const shellyInfo = SHELLY_MAP[_modalCh];
      let d;
      if (shellyInfo) {
        // Shelly: take a snapshot and send it to the describe endpoint
        const snapResp = await fetch(`${shellyInfo.snapUrl}?t=${Date.now()}`);
        if (!snapResp.ok) throw new Error("Could not capture snapshot");
        const blob = await snapResp.blob();
        const postResp = await fetch("/api/shelly-cam/describe", {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream" },
          body: blob,
        });
        d = await postResp.json();
      } else {
        // NVR camera
        const r = await fetch(`/api/camera/${_modalCh}/describe?hq=1`);
        d = await r.json();
      }
      desc.textContent = d.description || "Nothing specific visible in the frame.";
    } catch (e) {
      desc.textContent = "Analysis error: " + e.message;
    } finally {
      btn.disabled    = false;
      btn.textContent = "🔍 Describe";
    }
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById("modal") &&
        !e.target.classList.contains("modal-close")) return;
    const closingCh = _modalCh;
    _modalCh = null;
    clearInterval(_modalTsTimer);

    // Stop the video stream (HLS or MJPEG)
    const mImg = document.getElementById("modal-img");
    const mVid = document.getElementById("modal-video");
    mImg.src = "";
    stopHls(_modalHls, mVid);
    _modalHls = null;
    document.getElementById("modal").classList.remove("open");
    document.getElementById("modal-ts").textContent = "";
    const descEl = document.getElementById("modal-desc");
    if (descEl) { descEl.style.display = "none"; descEl.textContent = ""; }

    // Restore the card timer
    if (closingCh !== null) {
      const st = camState[closingCh];
      if (st?._pausedByModal) {
        st._pausedByModal = false;
        if (st._pausedMode === "live") {
          const cardImg = document.getElementById(`img-${closingCh}`);
          if (cardImg) cardImg.src = chVideoUrl(closingCh);
          st.timer = setInterval(() => {
            if (camState[closingCh]?.mode !== "live") return;
            const ts = document.getElementById(`cam-ts-${closingCh}`);
            if (ts) ts.textContent = nowStr();
          }, 1000);
        } else {
          st.timer = setInterval(() => refreshSnap(closingCh), SNAP_INTERVAL);
        }
      }
    }
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal({ target: document.getElementById("modal") });
  });

  // ── global actions (all cameras) ─────────────────
  function setAllLive() {
    CHANNELS.forEach(({ channel }) => {
      try { setLive(channel); } catch (e) { console.warn("live", channel, e); }
    });
  }
  function setAllSnap() {
    CHANNELS.forEach(({ channel }) => {
      try { setSnap(channel); } catch (e) { console.warn("snap", channel, e); }
    });
  }

  // ── settings modal ─────────────────────────────────────
  function openSettings() {
    const sec = Math.round(SNAP_INTERVAL / 1000);
    document.getElementById("set-interval").value       = sec;
    document.getElementById("set-interval-range").value = sec;
    document.getElementById("settings").classList.add("open");
  }
  function closeSettings(e) {
    if (e && e.target.id !== "settings" && !e.target.classList.contains("settings-btn")) return;
    document.getElementById("settings").classList.remove("open");
  }
  function saveSettings() {
    const sec = Math.min(60, Math.max(2, parseInt(document.getElementById("set-interval").value) || DEFAULT_SNAP_SEC));
    SNAP_INTERVAL = sec * 1000;
    persistSettings({ snapSec: sec });
    applyNewInterval();
    closeSettings();
  }
  function applyNewInterval() {
    // Restart timers for all cameras in snapshot mode + update the overlay
    CHANNELS.forEach(({ channel }) => {
      const st = camState[channel];
      if (!st) return;
      if (st.mode === "snap" && !st._pausedByModal) {
        clearInterval(st.timer);
        st.timer = setInterval(() => refreshSnap(channel), SNAP_INTERVAL);
      }
      const modeEl = document.getElementById(`cam-mode-${channel}`);
      if (modeEl && st.mode === "snap") {
        modeEl.textContent = `SNAP ${Math.round(SNAP_INTERVAL/1000)}s`;
      }
    });
    const sub = document.getElementById("hdr-sub");
    if (sub) sub.textContent = `${CHANNELS.length} cameras · auto-refresh ${Math.round(SNAP_INTERVAL/1000)}s`;
  }
  // Two-way sync between range ↔ number
  document.addEventListener("DOMContentLoaded", () => {
    const rng = document.getElementById("set-interval-range");
    const num = document.getElementById("set-interval");
    if (rng && num) {
      rng.addEventListener("input", () => { num.value = rng.value; });
      num.addEventListener("input", () => {
        const v = Math.min(60, Math.max(2, parseInt(num.value) || DEFAULT_SNAP_SEC));
        rng.value = v;
      });
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSettings({ target: document.getElementById("settings") });
  });

  // ── Camera type registry ──────────────────────────────
  // Populated at init() from /api/camera/list — contains type per channel.
  // type: "nvr_dahua" | "rtsp_generic" | "shelly"
  const CAMERA_TYPES = {};

  function chSnapUrl(ch) {
    if (CAMERA_TYPES[ch] === "shelly") {
      // Backend proxy to Shelly /camera/0/snapshot — replaces hardcoded
      // /shelly-snapshot{,-2,-3} from nginx.
      return `/api/cameras/${ch}/shelly-snapshot?t=${Date.now()}`;
    }
    return `/api/camera/${ch}/snapshot?t=${Date.now()}`;
  }
  function chVideoUrl(ch) {
    if (CAMERA_TYPES[ch] === "shelly") {
      return `/api/shelly-cam/${ch}/video`;
    }
    return `/api/camera/${ch}/video?fps=10&hq=1`;
  }
  function chLabel(ch) {
    return `Channel ${ch}`;
  }

  // Backward compat: SHELLY_MAP is now dynamic — only for the describe handler
  const SHELLY_MAP = new Proxy({}, {
    get(_, ch) {
      ch = parseInt(ch);
      if (CAMERA_TYPES[ch] === "shelly") {
        return {
          snapUrl: `/api/cameras/${ch}/shelly-snapshot`,
          videoUrl: `/api/shelly-cam/${ch}/video`,
          label: `Channel ${ch}`,
        };
      }
      return undefined;
    }
  });

  // ── initialization ──────────────────────────────────────
  async function init() {
    const grid = document.getElementById("cam-grid");

    // Recording arm cache — so we know which cameras to live-stream via HLS.
    // Non-blocking: /api/recordings/cameras can be slow (disk usage scan);
    // start cameras grid immediately, populate cache in background.
    refreshRecArmed().catch(() => {});
    setInterval(refreshRecArmed, 30000);

    let total = 0;
    try {
      const r = await fetch("/api/camera/list");
      const data = await r.json();
      const channels = data.channels || [];
      total = channels.length;

      channels.forEach(({ channel, name, type }, i) => {
        CHANNELS.push({ channel, name });
        CAMERA_TYPES[channel] = type;
        camState[channel] = { mode: "snap", timer: null, lastTs: null, ws: null };
        grid.insertAdjacentHTML("beforeend", buildCard(channel, name));

        // Stagger: each camera starts with offset i * (interval/total)
        const offset = i * Math.floor(SNAP_INTERVAL / Math.max(channels.length, 1));
        setTimeout(() => {
          refreshSnap(channel);
          camState[channel].timer = setInterval(() => refreshSnap(channel), SNAP_INTERVAL);
        }, offset);
      });
    } catch (e) {
      console.warn("camera list failed", e);
    }

    document.getElementById("hdr-sub").textContent =
      `${total} cameras · auto-refresh ${Math.round(SNAP_INTERVAL/1000)}s`;
  }

  window.addEventListener("beforeunload", () => {
    Object.values(camState).forEach(st => { if (st.ws) st.ws.close(); });
  });

  init().catch(console.error);
</script>
</body>
</html>
