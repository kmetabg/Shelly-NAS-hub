server {
    listen 80;
    server_name _;

    # ── Static files served directly by nginx ─────────────────────────────
    root /www/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # HTML pages are never cached → клиентите винаги получават най-новата.
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # /lib/*.js,*.css (auth-guard.js, hls.min.js, ...) — must-revalidate.
        location ~* ^/lib/.+\.(js|css)$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ── Camera WebSocket — ТРЯБВА преди общия /api/ location ─────────────
    location ~ ^/api/camera/[0-9]+/ws {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── MJPEG video stream — no buffering, long timeout ──────────────────
    location ~ ^/api/camera/[0-9]+/video {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── HLS live recording playlist + segments ───────────────────────────
    location ~ ^/api/recordings/[0-9]+/live {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 60s;
    }

    # ── Recording segments — large MP4 files, allow long downloads ───────
    location ~ ^/api/recordings/[0-9]+/segment {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── API + /health → FastAPI (uvicorn) ────────────────────────────────
    location ~ ^/(api|health|docs|openapi.json) {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        # Allow large form/file uploads (face crops bulk delete with many ids).
        client_max_body_size 32m;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
